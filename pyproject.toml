[project]
name = "cosyflo-cli"
version = "0.1.0"
description = "Thin, tested command layer over the Cosyflo Laravel REST API (payments slice)"
requires-python = ">=3.11"
dependencies = ["requests"]

[project.scripts]
cosyflo = "cosyflo_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cosyflo_cli"]