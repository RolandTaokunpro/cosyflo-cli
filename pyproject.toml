[project]
name = "cosyflo-cli"
version = "0.1.0"
description = "Thin, tested command layer over the Cosyflo Laravel REST API (payments slice)"
requires-python = ">=3.11"
dependencies = ["requests"]

[project.scripts]
cosyflo = "cosyflo_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cosyflo_cli"]

[tool.ruff.lint]
# BLE001: transport/network calls fail in arbitrary ways and map to typed
#         CLI errors at the boundary — blind catch + mapping is the design.
# RUF059: test runners unpack (code, out, err) tuples uniformly; unused
#         members are deliberate.
ignore = ["BLE001", "RUF059"]